[project]
name = "wellbeing-in-translation"
version = "0.1.0"
description = "Does the CAIS AI-wellbeing signal survive translation?"
requires-python = ">=3.10,<3.13"
# The cu128 wheels are Linux-only, so pin them to the pod. Analysis on a Mac
# needs numpy and matplotlib and nothing else.
dependencies = [
    "torch==2.11.0; sys_platform == 'linux'",
    "torchvision==0.26.0; sys_platform == 'linux'",
    "transformers>=5.10",
    "huggingface-hub>=0.34",
    "accelerate>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

# Lambda's A100 image ships driver 570.148.08, which is CUDA 12.8 and cannot
# run cu130 builds. vllm 0.27.1 requires torch 2.13.0, which PyTorch only
# publishes for cu130, so 0.26.0 (torch 2.11.0, available for cu128) is the
# newest usable version here. It still registers
# Gemma4UnifiedForConditionalGeneration, which is the only thing we need from it.
[project.optional-dependencies]
vllm = ["vllm==0.26.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# vllm pins torch exactly; without this uv refuses the cu128 local version.
override-dependencies = [
    "torch==2.11.0; sys_platform == 'linux'",
    "torchvision==0.26.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wbt"]
